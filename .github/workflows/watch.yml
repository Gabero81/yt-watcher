name: yt-watcher

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, at :17 past
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      pull_latest:
        description: "Test mode: pull the most recent video of each NEW channel"
        type: boolean
        default: false
      bootstrap_days:
        description: "First-run backfill: pull videos from the last N days for NEW channels (0 = none)"
        type: string
        default: "0"
      max_per_run:
        description: "Cap on transcripts this run"
        type: string
        default: "15"
      test_video:
        description: "Test mode: pull this one video (URL or ID) right now"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Pull new transcripts
        env:
          TRANSCRIPTAPI_KEY: ${{ secrets.TRANSCRIPTAPI_KEY }}
          MIN_SECONDS: "600"
          PULL_LATEST_ON_BOOTSTRAP: ${{ inputs.pull_latest == true && '1' || '0' }}
          TEST_VIDEO: ${{ inputs.test_video }}
          BOOTSTRAP_DAYS: ${{ inputs.bootstrap_days || '0' }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '15' }}
        run: python watcher.py

      - name: Commit inbox + seen.json
        run: |
          git config user.name "yt-watcher"
          git config user.email "yt-watcher@users.noreply.github.com"
          git add -A inbox seen.json last_run.log
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "watcher: $(date -u +'%Y-%m-%d %H:%M') new transcripts"
            git push
          fi
